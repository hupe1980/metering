# Zola configuration — https://www.getzola.org/documentation/getting-started/configuration/
base_url = "https://hupe1980.github.io/metering"
title = "metering"
description = "German energy-metering quantities for Rust — DST-correct Europe/Berlin calendar arithmetic, Zählerstandsgang to Lastgang, validation and Ersatzwertbildung, gas m³→kWh_Hs, § 14a Modul 3 tariff registers, EN 50160."
default_language = "en"

compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]

minify_html = true

taxonomies = [{ name = "topics", feed = true }]

[markdown]
smart_punctuation = false
bottom_footnotes = true


[search]
index_format = "elasticlunr_json"

[extra]
repo = "https://github.com/hupe1980/metering"
crate = "https://crates.io/crates/metering"
api_docs = "https://docs.rs/metering"
author = "hupe1980"

[link_checker]
# Links into the repository tree resolve only after merge; internal links are
# still checked.
skip_prefixes = ["https://github.com/hupe1980/metering/blob/"]
# docs.rs and crates.io rate-limit CI runners; a 429 is not a broken link.
skip_anchor_prefixes = ["https://docs.rs/", "https://crates.io/"]
