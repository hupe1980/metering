name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

# Allow one concurrent deployment; let an in-flight run finish so a published
# page is never half-written.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  ZOLA_VERSION: "0.22.1"

jobs:
  build:
    name: 🌐 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola
      # `check` validates every internal link and anchor; a 404 in the docs is a
      # build failure, not something a reader discovers.
      - name: check links
        run: zola --root site check
      - name: build
        run: zola --root site build --output-dir public --force
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    name: 🚀 deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
