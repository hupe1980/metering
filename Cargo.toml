[package]
name         = "metering"
description  = "German energy metering domain library — DST-correct Europe/Berlin calendar arithmetic, gas m3→kWh_Hs conversion, billing-period aggregation, Ersatzwertbildung, a robust validation engine, Bundesland holiday calendar and SLP/RLM/iMSys classification. Zero I/O, no async, no clock, exact decimal quantities."
version      = "0.17.0"
authors      = ["hupe1980"]
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/hupe1980/metering"
rust-version = "1.94"
readme       = "README.md"
keywords     = ["energy", "metering", "bdew", "mako", "msbg"]
categories   = ["science", "data-structures"]

[dependencies]
rust_decimal = { version = "1", features = ["macros"] }
serde        = { version = "1", features = ["derive"], optional = true }
thiserror    = "2"
time         = { version = "0.3", features = ["std", "macros", "serde-well-known", "parsing", "formatting"] }
time-tz      = { version = "2", features = ["db"] }
uuid         = { version = "1", features = ["v4", "v5", "serde"] }

[features]
default = []
serde   = ["dep:serde", "rust_decimal/serde"]

# docs.rs builds with default features unless told otherwise, which would hide
# every `serde` impl — including the wire representation this crate documents as
# semver-covered. Feature labels on the gated items come from `doc_auto_cfg`,
# which is automatic since Rust 1.92 and so needs no rustdoc flag at our MSRV.
[package.metadata.docs.rs]
all-features = true
targets      = ["x86_64-unknown-linux-gnu"]

[dev-dependencies]
proptest   = "1"
serde_json = "1"
time       = { version = "0.3", features = ["macros"] }

# Standalone crate — its own workspace root so `cargo` does not walk up to a
# parent workspace when built in place.
[workspace]
