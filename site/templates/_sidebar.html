{% set docs = get_section(path="docs/_index.md") %}
<nav class="sidebar" aria-label="Documentation">
  <p class="sidebar-title">Documentation</p>
  <ul>
    <li><a href="{{ docs.permalink }}"{% if section and section.permalink == docs.permalink %} aria-current="page"{% endif %}>Overview</a></li>
    {% for p in docs.pages %}
    <li><a href="{{ p.permalink }}"{% if page and page.permalink == p.permalink %} aria-current="page"{% endif %}>{{ p.title }}</a></li>
    {% endfor %}
  </ul>
</nav>
