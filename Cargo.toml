[package]
name         = "metering"
description  = "German energy metering domain library — DST-correct Europe/Berlin calendar arithmetic on both the Liefertag and the 06:00 Gastag, gas m3→kWh_Hs conversion, SigLinDe gas SLP, billing-period aggregation, Ersatzwertbildung, a robust validation engine, para 14a netzorientierte Steuerung and Modul 3 registers, para 42b/42c allocation, check-digit-validated MaLo-IDs and SLP/RLM/iMSys classification. Zero I/O, no async, no clock, exact decimal quantities."
version      = "0.20.0"
authors      = ["hupe1980"]
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/hupe1980/metering"
rust-version = "1.94"
readme       = "README.md"
keywords     = ["energy", "metering", "bdew", "mako", "msbg"]
categories   = ["science", "data-structures"]

[dependencies]
rust_decimal = { version = "1", features = ["macros"] }
serde        = { version = "1", features = ["derive"], optional = true }
thiserror    = "2"
time         = { version = "0.3", features = ["std", "macros", "parsing", "formatting"] }
time-tz      = { version = "2", features = ["db"] }

[features]
default = []
# `rust_decimal/serde-str`, not plain `serde`. The JSON is identical — a
# `Decimal` already travelled as its exact string — but the *deserialiser*
# changes from `deserialize_any` to `deserialize_str`, and `deserialize_any` is
# what a non-self-describing format cannot answer. Without it `MeterInterval`
# could not round-trip through postcard or bincode at all, which is precisely
# the claim the crate made about its hot types.
#
# `time/serde` is listed here rather than in `[dependencies]` so that a build
# of this crate that did not ask for serde does not compile `time`'s either.
# It used to arrive unconditionally through `serde-well-known`, whose only
# contribution was the `time::serde::rfc3339` module that nothing here used.
# How instants and dates actually travel is `src/wire.rs`.
serde   = ["dep:serde", "rust_decimal/serde-str", "time/serde"]

# docs.rs builds with default features unless told otherwise, which would hide
# every `serde` impl — including the wire representation this crate documents as
# semver-covered. Feature labels on the gated items come from `doc_auto_cfg`,
# which is automatic since Rust 1.92 and so needs no rustdoc flag at our MSRV.
[package.metadata.docs.rs]
all-features = true
targets      = ["x86_64-unknown-linux-gnu"]

[dev-dependencies]
# `postcard` is here to prove one claim: that a timestamp is RFC 3339 in JSON
# and stays `time`'s compact tuple in a binary format. `src/wire.rs` splits on
# `is_human_readable`, and a split nothing exercises is a split that rots.
postcard   = { version = "1", features = ["use-std"] }
proptest   = "1"
serde_json = "1"
time       = { version = "0.3", features = ["macros"] }

# Standalone crate — its own workspace root so `cargo` does not walk up to a
# parent workspace when built in place.
[workspace]
