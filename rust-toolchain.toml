[toolchain]
# Pin to the declared MSRV so every developer and CI lane compiles on exactly
# the same toolchain. Bumping the MSRV requires updating this value, the
# `rust-version` key in Cargo.toml, the `msrv` CI job in
# .github/workflows/ci.yml, and the `msrv` variable in the justfile.
#
# Floor contributors:
#   - edition 2024 requires rustc ≥ 1.85
#   - `let_chains` stabilised in 1.88 (used across the crate)
#   - time ≥ 0.3.47 declares rust-version = "1.88"
#
# CI (jobs pass RUSTUP_TOOLCHAIN, which overrides this file) verifies the
# pinned version actually builds — treat 1.94 as the supported floor, not an
# upper bound on what a contributor may have installed.
channel    = "1.94"
components = ["rustfmt", "clippy"]
