name: Release

# A tag `vX.Y.Z` matching Cargo.toml publishes to crates.io via trusted
# publishing (OIDC, no registry secret), attests provenance for the uploaded
# .crate, and attaches it and a CycloneDX SBOM to the GitHub release.
# Dispatching on a branch runs `verify` only.
#
# crates.io setup: Trusted Publishing → hupe1980/metering, workflow
# `release.yml`, environment `crates-io`.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: ✅ verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: just,cargo-deny
      - id: version
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
            exit 1
          fi
      # No cache here: a release builds from a clean slate.
      - run: just ci

  publish:
    name: 🚀 publish to crates.io
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write     # OIDC: trusted publishing and the provenance signature
      attestations: write # store the attestation on GitHub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-cyclonedx
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --all-features --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      # Attest the uploaded .crate; verify with
      # `gh attestation verify <file> -R hupe1980/metering`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/metering-${{ needs.verify.outputs.version }}.crate
      - name: SBOM (CycloneDX)
        run: |
          cargo cyclonedx --all-features --format json --spec-version 1.5 --override-filename metering.cdx
          mkdir dist
          mv metering.cdx.json dist/metering-${{ needs.verify.outputs.version }}.cdx.json
          cp target/package/metering-${{ needs.verify.outputs.version }}.crate dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  github-release:
    name: 🏷️ GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "v$VERSION" \
            --generate-notes \
            --verify-tag
