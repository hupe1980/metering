[package]
name         = "metering"
description  = "German energy metering quantities: DST-correct Europe/Berlin and 06:00-Gastag calendar arithmetic, exact decimal values, and the market's own code lists. Zero I/O, no async, no clock."
version      = "0.25.0"
authors      = ["hupe1980"]
edition      = "2024"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/hupe1980/metering"
# MSRV: the oldest rustc the whole suite passes on (CI `msrv` job; the justfile
# and CI read this line). Floor: `let_chains` and `time` 0.3.47 both need 1.88.
rust-version = "1.88"
readme       = "README.md"
keywords     = ["energy", "metering", "bdew", "mako", "msbg"]
categories   = ["science", "data-structures"]
homepage     = "https://hupe1980.github.io/metering"
# The crate, its tests and the prose its doctests compile — no repo tooling.
include      = ["/src/**", "/tests/**", "/examples/**", "/site/content/**", "/README.md", "/CHANGELOG.md", "/LICENSE-*"]

# Lower bounds are the oldest versions the suite passes on; CI's
# `minimal-versions` job checks them.
[dependencies]
rust_decimal = { version = "1.37", features = ["macros"] }
# `serde` 1.0.220: the first with `serde_core`, which `time/serde` needs.
serde        = { version = "1.0.220", features = ["derive"], optional = true }
thiserror    = "2"
time         = { version = "0.3.47", features = ["std", "macros", "parsing", "formatting"] }
time-tz      = { version = "2", features = ["db"] }

[features]
default = []
# No `rust_decimal` serde feature: features unify across the consumer's graph,
# so `src/wire.rs` fixes the representation per field instead.
serde   = ["dep:serde", "time/serde"]

# All features, so docs.rs shows the `serde` impls (in semver scope).
[package.metadata.docs.rs]
all-features = true
targets      = ["x86_64-unknown-linux-gnu"]

[dev-dependencies]
# `postcard` tests `src/wire.rs` on a non-self-describing, binary format.
# No default features: `heapless-cas` pulls `atomic-polyfill` (RUSTSEC-2023-0089).
postcard   = { version = "1", default-features = false, features = ["use-std"] }
proptest   = "1.6"
serde_json = "1.0.100"
time       = { version = "0.3.47", features = ["macros"] }

# Own workspace root, so cargo does not walk up to a parent workspace.
[workspace]
