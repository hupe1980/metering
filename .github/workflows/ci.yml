name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # `rust-toolchain.toml` pins the MSRV. RUSTUP_TOOLCHAIN takes precedence over
  # that file, so each job below selects its own toolchain explicitly.
  RUSTUP_TOOLCHAIN: stable

jobs:
  fmt:
    name: 🎨 rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: 📎 clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  purity:
    name: 🧊 purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The crate guarantees equal inputs give equal outputs: no clock read, no
      # I/O, no unsafe outside comments. Cheap to check, easy to regress.
      - name: no ambient state in src/
        run: |
          hits="$(grep -rn --include='*.rs' -E \
            'now_utc|SystemTime::now|Instant::now|std::(fs|env|net|process)|\bunsafe\b' \
            src/ | grep -vE ':[[:space:]]*(///|//!|//)' || true)"
          if [ -n "$hits" ]; then
            echo "::error::ambient state or unsafe reached the source"
            echo "$hits"
            exit 1
          fi
          echo "pure: no clock, no I/O, no unsafe"

  test:
    name: 🧪 test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: test (default features)
        run: cargo test --all-targets
      - name: test (all features)
        run: cargo test --all-features --all-targets
      - name: doctests (all features)
        run: cargo test --all-features --doc
      # The example asserts its own invariants, so running it is a test.
      - name: examples
        run: cargo run --all-features --example pipeline

  features:
    name: 🎛️ feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build (no default features)
        run: cargo build --no-default-features
      - name: build (serde)
        run: cargo build --no-default-features --features serde

  msrv:
    name: 🦀 MSRV 1.94
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.94"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      # Keep in sync with `rust-version` in Cargo.toml and `rust-toolchain.toml`.
      - run: cargo check --all-features --all-targets

  docs:
    name: 📚 rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  package:
    name: 📦 package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Catches missing files / bad metadata before a release tag is cut.
      - run: cargo publish --dry-run --all-features

  semver:
    name: 🔒 semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-semver-checks
      # The wire representation is declared semver-covered and pinned by a
      # literal test; this is the API half of the same promise. It compares
      # against the most recent crates.io release and names every break, which
      # is the list a CHANGELOG entry needs.
      #
      # `--release-type patch` is load-bearing, not tidiness. Without it the
      # tool infers the bump from Cargo.toml — and for a 0.x crate a minor bump
      # already *declares* a major change, so every lint is skipped and the lane
      # reports `0 checks: 0 pass, 254 skip` however much it broke. Asking
      # "would this be a legal patch release?" is the question that lists
      # everything not backwards-compatible, at any version.
      #
      # It does not fail the build while the crate is pre-1.0 and every release
      # is a deliberate hard cut: `continue-on-error` makes the output a report
      # rather than a gate. Flip it off at 1.0, when a break stops being cheap.
      - run: cargo semver-checks check-release --all-features --release-type patch
        continue-on-error: true

  audit:
    name: 🛡️ audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-audit
      # Run cargo-audit directly rather than via rustsec/audit-check: that action
      # reports through the Checks API, which needs `checks: write` and is
      # read-only for pull requests from forks, so it fails the job on the
      # permission rather than on any finding. The exit code is the signal.
      - run: cargo audit --deny warnings
